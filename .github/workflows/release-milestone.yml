name: Release milestone

# Gives a release-please PR the milestone named after its version, creating it
# if needed, blocks the PR while the milestone has other open issues or PRs, and
# closes the milestone when the PR is merged. release-please doesn't do this
# itself: milestone support was declined upstream in
# https://github.com/googleapis/release-please/issues/1077.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - milestoned
      - demilestoned
      - closed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  milestone:
    name: Milestone complete
    if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # Find or create the milestone and read its open issue count.
      pull-requests: write # Set the PR's milestone.
    steps:
      - name: Check the PR's milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MILESTONE: ${{ github.event.pull_request.milestone.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # release-please titles look like "chore(main): release 2.0.0".
          version="${PR_TITLE##* release }"
          # Anchored, so the version is safe to put in the jq filter below.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::No release version found in the title: $PR_TITLE"
            exit 1
          fi
          if [ -z "$MILESTONE" ]; then
            # Use a milestone created ahead of time, or create one.
            MILESTONE=$(gh api "repos/$REPO/milestones?state=open&per_page=100" \
              --jq "map(select(.title == \"$version\" or .title == \"v$version\")) | first | .number // empty")
            if [ -z "$MILESTONE" ]; then
              MILESTONE=$(gh api -X POST "repos/$REPO/milestones" -f title="$version" --jq .number)
              echo "Created milestone $version."
            fi
            # Changes made with GITHUB_TOKEN don't start new runs, so check it here.
            gh api -X PATCH "repos/$REPO/issues/$PR_NUMBER" -F milestone="$MILESTONE" --silent
            echo "Added this PR to milestone $version."
          fi
          # Read the milestone now: the event's copy is stale after a re-run.
          # Title last, since it may contain spaces.
          read -r open url title < <(gh api "repos/$REPO/milestones/$MILESTONE" \
            --jq '"\(.open_issues) \(.html_url) \(.title)"')
          if [ "${title#v}" != "$version" ]; then
            echo "::error::Milestone $title doesn't match the release version $version: $url"
            exit 1
          fi
          # This PR is open and in the milestone, so it counts itself.
          open=$((open - 1))
          if [ "$open" -gt 0 ]; then
            echo "::error::Milestone $title has $open other open item(s): $url"
            exit 1
          fi
          echo "Milestone $title is complete: $url"

  close:
    name: Close milestone
    if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.milestone }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # Close the milestone.
    steps:
      - name: Close the PR's milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE: ${{ github.event.pull_request.milestone.number }}
        run: |
          # The merged PR is closed, so it no longer counts as open.
          read -r open url title < <(gh api "repos/$REPO/milestones/$MILESTONE" \
            --jq '"\(.open_issues) \(.html_url) \(.title)"')
          if [ "$open" -gt 0 ]; then
            echo "::error::Not closing milestone $title: it has $open open item(s): $url"
            exit 1
          fi
          gh api -X PATCH "repos/$REPO/milestones/$MILESTONE" -f state=closed \
            --jq '"Closed milestone \(.title): \(.html_url)"'
