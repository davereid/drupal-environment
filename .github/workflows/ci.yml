name: CI

on:
  push:
    branches:
      - main
      - '[0-9]*.x' # Not release-please's own release-please--branches--1.x.
  pull_request:
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test PHP ${{ matrix.php }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Check out the code.
      id-token: write # Upload coverage to Qlty with OIDC instead of a stored token.
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        os: ['ubuntu-latest']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the composer PHP config
        run: echo "PHP_DEFAULT_VERSION=$(composer config platform.php)" >> "$GITHUB_ENV"
      - run: composer config --unset platform
      - run: composer diagnose || true
      - run: composer install
      - run: composer audit
      - run: composer run lint
      - run: composer run test
      - run: npm ci
      - run: vendor/bin/grumphp run
      - name: Test & publish code coverage
        if: ${{ matrix.php == env.PHP_DEFAULT_VERSION && matrix.os == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0
        with:
          oidc: true
          files: ${{ github.workspace }}/build/logs/clover.xml

  test-drupal:
    name: Test Drupal ${{ matrix.drupal }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code.
    strategy:
      matrix:
        # The Drupal major version, for both DDEV's project type and Composer.
        # Changing it renames the job, so update the required checks too.
        drupal: ['11']
    steps:
      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          autostart: false
      - name: Create a Drupal site
        env:
          DRUPAL_VERSION: ${{ matrix.drupal }} # Through env rather than expanded in the script (zizmor template-injection).
        run: |
          # Without DDEV's settings.ddev.php, so settings.php is what site:install writes.
          ddev config --project-type="drupal${DRUPAL_VERSION}" --docroot=web --disable-settings-management
          ddev start
          ddev composer create-project -n "drupal/recommended-project:^${DRUPAL_VERSION}"
      # After create-project, which needs an empty directory, and inside the
      # DDEV project, which is the only directory DDEV mounts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lib
          persist-credentials: false
      - name: Require this library, Environment Indicator and Drush
        run: |
          ddev composer config repositories.drupal-environment '{"type": "path", "url": "lib"}'
          ddev composer require -n 'davereid/drupal-environment:*@dev' drupal/environment_indicator drush/drush
      - name: Install Drupal
        run: |
          ddev drush site:install -y minimal --db-url=mysql://db:db@db/db
          ddev drush pm:install -y environment_indicator
      - name: Include the settings file
        run: |
          chmod u+w web/sites/default web/sites/default/settings.php
          # As the README tells sites to.
          echo 'include \DrupalEnvironment\Environment::settingsFile();' >> web/sites/default/settings.php
          # Each environment-specific settings file adds its name to a list, to show it was included.
          for name in prod test dev ci testing; do
            echo "<?php \$settings['drupal_environment_included'][] = '${name}';" > "web/sites/default/settings.${name}.php"
          done
      - name: Check the indicator and settings files in each environment
        run: |
          # A variable to set, the indicator name, and the settings files included, in order.
          check() {
            # shellcheck disable=SC2016 # PHP code, not shell variables.
            actual=$(ddev exec env "$1" vendor/bin/drush php:eval 'echo \Drupal::config("environment_indicator.indicator")->get("name") . "|" . implode(",", \Drupal\Core\Site\Settings::get("drupal_environment_included", []));')
            echo "$1: ${actual}"
            test "${actual}" = "$2|$3"
          }
          # DDEV is local, so environments without their own indicator get Local.
          check ENVIRONMENT= Local ''
          check ENVIRONMENT=prod Production prod
          check ENVIRONMENT=test Staging test
          check ENVIRONMENT=dev Development dev
          check ENVIRONMENT=ci CI ci
          # isTest() for a Playwright run adds settings.testing.php.
          check PLAYWRIGHT_SETUP=1 Local testing

  lint-actions:
    name: Lint actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose # List the checked files, since a clean run prints nothing.
      - name: Run zizmor
        if: ${{ !cancelled() }} # Also report zizmor's findings when actionlint fails.
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false # Fail the job on findings instead of uploading them to code scanning.
