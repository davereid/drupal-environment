name: Release Please

on:
  push:
    branches:
      - main
      - '[0-9]*.x' # Not release-please's own release-please--branches--1.x.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: release # Holds the App's private key, for main and [0-9]*.x only.
    # Only used without the App (no RELEASE_PLEASE_CLIENT_ID variable): GITHUB_TOKEN
    # then opens the release PR, and its checks wait for approval.
    permissions:
      contents: write # Create release commits, tags and GitHub releases.
      issues: write # Create and update release labels.
      pull-requests: write # Open and update the release pull request.
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so release PR checks start without approval (#60).
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        if: vars.RELEASE_PLEASE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write # Create release commits, tags and GitHub releases.
          permission-pull-requests: write # Open and update the release pull request, and its labels.

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          target-branch: ${{ github.ref_name }}
