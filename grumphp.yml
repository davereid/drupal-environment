grumphp:
  ascii: null
  fixer:
    enabled: true
    fix_by_default: true
  tasks:
    phplint: ~
    yamllint: ~
    jsonlint:
      ignore_patterns:
        - /^tests\/fixtures\/invalid\.json/
    composer: ~
    composer_normalize: ~
    phpcs: ~
    phpstan: ~
    phpunit: ~
    npm_script:
      script: "lint"
      triggered_by: [md, php, yml, json]
      is_run_task: true
